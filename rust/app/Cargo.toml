[package]
name = "server"
version = "3.0.0"
edition = "2024"
publish = false
description = "VoxelCraft pure Rust multiplayer server with built-in anti-cheat and HTTP client hosting"

[[bin]]
name = "server"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8", features = ["ws"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
futures-util = "0.3"
hex = "0.4"
indexmap = { version = "2", features = ["serde"] }
num-bigint = "0.4"
num-traits = "0.2"
rand = "0.8"
scrypt = { version = "0.11", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
subtle = "2"
tokio = { version = "1", features = ["full"] }
voxelcraft_core = { path = "../core" }

[workspace]
