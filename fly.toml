# fly.toml app configuration file generated for dill-voxelcraft on 2026-11-22T00:07:07-05:00
#
# See https://docs.fly.io/reference/configuration for information about how to use this file.
#

app = 'dill-voxelcraft'
primary_region = 'ord'

[build]
[env]
  DATA_DIR = '/data'
  HOST = '0.0.0.0'
  PORT = '8080'
  TRUST_PROXY = 'true'
  URL = 'https://play.dill.moe'

[[mounts]]
  source = 'voxelcraft_data'
  destination = '/data'
  initial_size = '2gb'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
