app = 'dill-voxelcraft'
primary_region = 'ord'

[build]

[env]
  HOST = '0.0.0.0'
  PORT = '8080'
  DATA_DIR = '/data'
  NO_CLIENT = '1'
  TRUST_PROXY = 'true'
  URL = 'https://play.dill.moe'

[[mounts]]
  source = 'voxelcraft_data'
  destination = '/data'
  initial_size = '2gb'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
